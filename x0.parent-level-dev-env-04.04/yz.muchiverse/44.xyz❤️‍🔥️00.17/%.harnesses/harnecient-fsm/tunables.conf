# tunables.conf — the hand-tunable "joints" of run_plan.sh, direct
# instruction 2026-08-13: "even if we had to set 'weights' nodes by
# hand it would be nice to know that they were being used as tunable
# 'joints'." This file IS that - every value here is a real decision
# point run_plan.sh currently hardcodes as a magic number, extracted
# so a human can hand-tune it today (edit this file, no code change),
# AND so a future Stage 1 heuristic or Stage 2 learned-weight system
# (HARNESS-DELEGATION-PIPELINE.md §7.3) has an EXISTING slot to write
# into instead of needing a refactor to find where these values live.
#
# Format: plain shell variable assignments, sourced directly by
# run_plan.sh after its own defaults are set - only override what you
# actually want to change, comment out or delete the rest to keep
# defaults. No section is "load-bearing config" in the usual house PDL
# sense - this is closer to a dial panel than an app config file.

# --- navigation delegation joint ---
# Which model answers "what menu item do you want" for NAVIGATE steps.
# Live-tested 2026-08-13 (HARNESS-DELEGATION-PIPELINE.md §6): gemma3:1b
# scored 3/3 correct on clean labels via plain-text intent. Untested on
# gemma3:270m/stable-code/llama2 for this specific task - a real
# candidate for Stage 1 per-goal-pattern weighting once enough log rows
# exist (§7.3), not assumed to be the best choice forever.
#NAV_MODEL="gemma3:1b"

# How long to wait after any 'p' relay dump before trusting the
# receipt file has been rewritten - open-hai's own main loop polls
# every ~150ms, this is generous headroom, not a tight bound.
#DUMP_SETTLE_S=1

# --- dispatch-result polling joints ---
# How many times to poll the receipt (POLL_INTERVAL_S apart) waiting
# for a STEP's tool result to land before declaring TIMEOUT. Read-only
# tools pre-execute near-instantly (live-verified), so the default is
# generous, not tight - loosen if testing against a busier/slower host.
#POLL_TRIES=15
#POLL_INTERVAL_S=0.5

# How long to wait after activating a NAVIGATE step before dumping the
# post-action receipt - must be long enough for a redraw to actually
# happen (relay poll cadence is ~150ms in open-hai's own main loop, see
# khtpm_open_hai_render.c), tight values risk capturing a stale receipt.
#NAV_SETTLE_S=0.5

# Delay between each relay code write (digit-jump keys, arm, submit) -
# too tight risks outrunning open-hai's own relay poll cadence and
# losing codes, too loose just makes runs slower. 0.2s has been
# reliable in every live test this session; not yet stress-tested at
# lower values.
#RELAY_CODE_DELAY_S=0.2

# --- replan joint ---
# How many times a STEP whose assertion fails (after a REAL dispatch,
# not a timeout/fail-closed) gets a Harnecient-suggested alternative
# phrasing retried. 0 = off (default - NEEDS_REPLAN is a real, opt-in
# capability, not a silent behavior change). Each retry is its own
# artifact/observation-log row, nothing overwrites the original
# attempt's evidence. Added 2026-08-13, see HARNESS-DELEGATION-
# PIPELINE.md §8.
#MAX_RETRIES=0

# --- process lifecycle joint ---
# How long to wait after button.sh reports a launch before trusting
# pgrep's "exactly 1 process" count - covers X11 connection + first
# redraw startup time.
#LAUNCH_SETTLE_S=1
