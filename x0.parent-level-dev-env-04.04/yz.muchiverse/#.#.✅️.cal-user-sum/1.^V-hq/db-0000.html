<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Maker Database Layout</title>
    <style>
        :root {
            --bg-color: #f0f0f0;
            --border-color: #aca899;
            --window-bg: #ffffff;
            --text-color: #000000;
            --selected-bg: #3399ff;
            --selected-text: #ffffff;
            --tab-active: #fcfcfc;
            --tab-inactive: #e0dfdb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 10px;
            user-select: none;
        }

        /* Main Window Wrapper */
        .database-window {
            border: 2px solid var(--border-color);
            background-color: var(--bg-color);
            padding: 5px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Tab Navigation Bar */
        .tab-bar {
            display: flex;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
            padding-left: 5px;
            gap: 2px;
        }

        .tab {
            padding: 6px 12px;
            background-color: var(--tab-inactive);
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-top-left-radius: 3px;
            border-top-right-radius: 3px;
            cursor: pointer;
            margin-bottom: -1px;
        }

        .tab.active {
            background-color: var(--tab-active);
            font-weight: bold;
            border-bottom: 1px solid var(--tab-active);
            z-index: 2;
        }

        /* Main Content Layout */
        .main-content {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 10px;
            background-color: var(--tab-active);
            border: 1px solid var(--border-color);
            border-top: none;
            padding: 10px;
            height: 550px;
        }

        /* Sidebar - Data ID List */
        .sidebar {
            border: 1px solid var(--border-color);
            background-color: var(--window-bg);
            display: flex;
            flex-direction: column;
        }

        .list-header {
            padding: 5px;
            background-color: #e4e4e4;
            border-bottom: 1px solid var(--border-color);
            font-weight: bold;
        }

        .data-list {
            overflow-y: auto;
            flex-grow: 1;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .data-item {
            padding: 4px 8px;
            cursor: pointer;
        }

        .data-item:hover {
            background-color: #e5f1fb;
        }

        .data-item.selected {
            background-color: var(--selected-bg);
            color: var(--selected-text);
        }

        .list-actions {
            padding: 5px;
            border-top: 1px solid var(--border-color);
            background-color: #fafdff;
            text-align: center;
        }

        /* Workspace - Editor Settings */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            overflow-y: auto;
        }

        .settings-block {
            border: 1px solid var(--border-color);
            padding: 10px;
            background-color: #fafafa;
            border-radius: 3px;
            position: relative;
            margin-top: 5px;
        }

        .block-title {
            position: absolute;
            top: -8px;
            left: 10px;
            background-color: var(--tab-active);
            padding: 0 5px;
            font-weight: bold;
            font-size: 11px;
            color: #444;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 3px;
            font-weight: 500;
        }

        input[type="text"], input[type="number"], select, textarea {
            padding: 4px;
            border: 1px solid var(--border-color);
            border-radius: 2px;
            font-family: inherit;
            font-size: 12px;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        /* Parameter Sliders/Bars Mockup */
        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .stat-label {
            width: 40px;
            font-weight: bold;
        }

        .stat-bar {
            flex-grow: 1;
            height: 12px;
            background-color: #e0e0e0;
            border: 1px solid #999;
            margin: 0 8px;
            position: relative;
        }

        .stat-fill {
            height: 100%;
            background-color: #4caf50;
            width: 60%;
        }

        /* Traits / Effects List Box */
        .box-list {
            border: 1px solid var(--border-color);
            background-color: #fff;
            height: 120px;
            overflow-y: auto;
            padding: 5px;
        }

        .box-item {
            padding: 2px 4px;
            border-bottom: 1px dashed #eee;
        }

        /* Window Bottom Buttons */
        .window-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
            padding-right: 5px;
        }

        button {
            padding: 6px 16px;
            border: 1px solid #707070;
            background-color: #e1e1e1;
            cursor: pointer;
            border-radius: 3px;
            min-width: 75px;
        }

        button:hover {
            background-color: #e5f1fb;
            border-color: #0078d7;
        }

        button.primary {
            font-weight: bold;
        }
    </style>
</head>
