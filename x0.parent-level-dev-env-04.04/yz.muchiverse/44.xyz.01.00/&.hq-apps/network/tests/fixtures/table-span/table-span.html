<!doctype html>
<html><head><title>SpanTable</title></head><body>
<h1>Span tables</h1>
<table>
<caption>First table</caption>
<tr><th colspan="2">Price plan</th></tr>
<tr><td rowspan="2">Group</td><td>Free</td></tr>
<tr><td>Pro</td></tr>
<tr><td colspan="0">Zero span</td><td>After</td></tr>
<tr><td title="a colspan b">Quoted</td><td>Ok</td></tr>
</table>
<table>
<caption>Second table</caption>
<tr><th>Key</th><th>Value</th></tr>
<tr><td>a</td><td>1</td><td>EXTRA</td></tr>
<tr><td>b</td><td>2</td></tr>
</table>
<p>Outro paragraph.</p>
</body></html>
