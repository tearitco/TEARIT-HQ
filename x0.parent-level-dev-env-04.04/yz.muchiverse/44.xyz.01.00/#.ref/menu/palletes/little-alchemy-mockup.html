<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Alchemy – Periodic & Beyond Mockup</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --card: #243044;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --success: #22c55e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
      --workspace: #0c1220;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    header h1 span { color: var(--accent); }

    .stats {
      display: flex;
      gap: 20px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .stats strong { color: var(--text); }

    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .search {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .search input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .search input:focus { border-color: var(--accent); }

    .element-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .el-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      font-size: 0.9rem;
      cursor: grab;
      text-align: left;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      user-select: none;
    }

    .el-btn:hover {
      border-color: var(--accent);
      background: #2a3a52;
      transform: translateY(-1px);
    }

    .el-btn:active { cursor: grabbing; }

    .el-btn.locked {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }

    .el-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #334155, #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
    }

    .el-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .el-meta {
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* Workspace */
    .workspace-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .workspace {
      flex: 1;
      background:
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.06) 0%, transparent 40%),
        var(--workspace);
      position: relative;
      overflow: hidden;
    }

    .workspace-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      color: var(--muted);
      font-size: 1.1rem;
      opacity: 0.5;
      text-align: center;
      padding: 40px;
      transition: opacity 0.3s;
    }

    .workspace.has-items .workspace-hint { opacity: 0; }

    .ws-item {
      position: absolute;
      width: 90px;
      height: 90px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: grab;
      user-select: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
      z-index: 10;
    }

    .ws-item:hover {
      border-color: var(--accent);
      box-shadow: 0 6px 28px rgba(59, 130, 246, 0.25);
    }

    .ws-item.dragging {
      opacity: 0.85;
      z-index: 100;
      cursor: grabbing;
      transform: scale(1.05);
    }

    .ws-item.combine-target {
      border-color: var(--success);
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.3);
      transform: scale(1.08);
    }

    .ws-item .icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: white;
      margin-bottom: 6px;
    }

    .ws-item .label {
      font-size: 0.72rem;
      text-align: center;
      padding: 0 4px;
      line-height: 1.2;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ws-item .close {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      border: none;
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .ws-item:hover .close { display: flex; }

    /* Toast / discovery */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #166534, #15803d);
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      z-index: 1000;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.new-discovery {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
    }

    /* Controls bar */
    .controls {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:hover { border-color: var(--accent); background: #2a3a52; }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn.primary:hover { background: var(--accent-hover); }

    .info-text {
      font-size: 0.8rem;
      color: var(--muted);
      margin-left: auto;
    }

    /* Particle effect on combine */
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>

    // ─── Parse elements ────────────────────────────────────────────────────
    const elements = [];
    const recipeMap = new Map(); // key: "minId_maxId" → result index

    RAW.trim().split('\n').forEach((line, idx) => {
      const parts = line.trim().split(/\s+/);
      const name = parts[0];
      const nums = parts.slice(1).map(Number);
      const [a, b, c, p1, p2] = nums;
      elements.push({
        id: idx,
        name,
        a, b, c,
        parents: (p1 === -1 && p2 === -1) ? null : [p1, p2],
        discovered: false
      });
      if (p1 !== -1) {
        const key = [Math.min(p1, p2), Math.max(p1, p2)].join('_');
        // Prefer first match if collisions (data should be unique)
        if (!recipeMap.has(key)) recipeMap.set(key, idx);
      }
    });

    // Base elements start unlocked
    elements.forEach(el => {
      if (!el.parents) el.discovered = true;
    });

    // ─── State ─────────────────────────────────────────────────────────────
    let workspaceItems = []; // { uid, elId, x, y }
    let nextUid = 1;
    let dragState = null; // { type: 'sidebar'|'ws', elId, uid?, offsetX, offsetY, ghost? }

    const STORAGE_KEY = 'littleAlchemyMockup_v1';

    function saveProgress() {
      const discovered = elements.filter(e => e.discovered).map(e => e.id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ discovered }));
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (Array.isArray(data.discovered)) {
          data.discovered.forEach(id => {
            if (elements[id]) elements[id].discovered = true;
          });
        }
      } catch (_) {}
    }

    loadProgress();

    // ─── DOM refs ──────────────────────────────────────────────────────────
    const listEl = document.getElementById('element-list');
    const workspace = document.getElementById('workspace');
    const searchInput = document.getElementById('search');
    const toast = document.getElementById('toast');
    const discoveredCount = document.getElementById('discovered-count');
    const totalCount = document.getElementById('total-count');
    const wsCount = document.getElementById('ws-count');

    totalCount.textContent = elements.length;

    // ─── UI helpers ────────────────────────────────────────────────────────
    function showToast(msg, isNew = false) {
      toast.textContent = msg;
      toast.className = 'toast' + (isNew ? ' new-discovery' : '');
      toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function updateStats() {
      discoveredCount.textContent = elements.filter(e => e.discovered).length;
      wsCount.textContent = workspaceItems.length;
      workspace.classList.toggle('has-items', workspaceItems.length > 0);
    }

    function shortName(name) {
      // First letter or first two for short names
      if (name.length <= 3) return name;
      return name.slice(0, 2).toUpperCase();
    }

    function renderList(filter = '') {
      const q = filter.toLowerCase().trim();
      listEl.innerHTML = '';
      const sorted = [...elements].sort((a, b) => {
        if (a.discovered !== b.discovered) return a.discovered ? -1 : 1;
        return a.id - b.id;
      });

      sorted.forEach(el => {
        if (q && !el.name.toLowerCase().includes(q)) return;
        const btn = document.createElement('button');
        btn.className = 'el-btn' + (el.discovered ? '' : ' locked');
        btn.dataset.id = el.id;
        btn.innerHTML = `
          <div class="el-icon">${shortName(el.name)}</div>
          <div class="el-name">${el.discovered ? el.name : '???'}</div>
          <div class="el-meta">${el.discovered ? `#${el.id}` : ''}</div>
        `;
        if (el.discovered) {
          btn.addEventListener('mousedown', (e) => startSidebarDrag(e, el.id));
          btn.addEventListener('touchstart', (e) => startSidebarDrag(e, el.id), { passive: false });
        }
        listEl.appendChild(btn);
      });
    }

    // ─── Workspace item management ─────────────────────────────────────────
    function createWsItem(elId, x, y) {
      const uid = nextUid++;
      const item = { uid, elId, x, y };
      workspaceItems.push(item);
      renderWsItem(item);
      updateStats();
      return item;
    }

    function renderWsItem(item) {
      let div = document.getElementById('ws-' + item.uid);
      if (!div) {
        div = document.createElement('div');
        div.className = 'ws-item';
        div.id = 'ws-' + item.uid;
        div.dataset.uid = item.uid;
        workspace.appendChild(div);

        div.addEventListener('mousedown', (e) => startWsDrag(e, item.uid));
        div.addEventListener('touchstart', (e) => startWsDrag(e, item.uid), { passive: false });

        const closeBtn = document.createElement('button');
        closeBtn.className = 'close';
        closeBtn.innerHTML = '×';
        closeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          removeWsItem(item.uid);
        });
        div.appendChild(closeBtn);
      }

      const el = elements[item.elId];
      div.style.left = item.x + 'px';
      div.style.top = item.y + 'px';
      // Keep icon + label (close is already there)
      const icon = div.querySelector('.icon') || (() => {
        const i = document.createElement('div');
        i.className = 'icon';
        div.insertBefore(i, div.firstChild);
        return i;
      })();
      icon.textContent = shortName(el.name);

      let label = div.querySelector('.label');
      if (!label) {
        label = document.createElement('div');
        label.className = 'label';
        div.appendChild(label);
      }
      label.textContent = el.name;
    }

    function removeWsItem(uid) {
      workspaceItems = workspaceItems.filter(i => i.uid !== uid);
      const div = document.getElementById('ws-' + uid);
      if (div) div.remove();
      updateStats();
    }

    function clearWorkspace() {
      workspaceItems.forEach(i => {
        const d = document.getElementById('ws-' + i.uid);
        if (d) d.remove();
      });
      workspaceItems = [];
      updateStats();
    }

    // ─── Drag logic ────────────────────────────────────────────────────────
    function getPointer(e) {
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function startSidebarDrag(e, elId) {
      e.preventDefault();
      const pt = getPointer(e);
      const rect = workspace.getBoundingClientRect();
      // Create a temporary ghost on workspace coordinate system later
      dragState = {
        type: 'sidebar',
        elId,
        startX: pt.x,
        startY: pt.y,
        offsetX: 45,
        offsetY: 45
      };
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragEnd);
      document.addEventListener('touchmove', onDragMove, { passive: false });
      document.addEventListener('touchend', onDragEnd);
    }

    function startWsDrag(e, uid) {
      if (e.target.classList.contains('close')) return;
      e.preventDefault();
      const pt = getPointer(e);
      const item = workspaceItems.find(i => i.uid === uid);
      if (!item) return;
      const div = document.getElementById('ws-' + uid);
      const rect = div.getBoundingClientRect();
      dragState = {
        type: 'ws',
        uid,
        elId: item.elId,
        offsetX: pt.x - rect.left,
        offsetY: pt.y - rect.top
      };
      div.classList.add('dragging');
      document.addEventListener('mousemove', onDragMove);
      document.addEventListener('mouseup', onDragEnd);
      document.addEventListener('touchmove', onDragMove, { passive: false });
      document.addEventListener('touchend', onDragEnd);
    }

    function onDragMove(e) {
      if (!dragState) return;
      e.preventDefault();
      const pt = getPointer(e);

      if (dragState.type === 'ws') {
        const item = workspaceItems.find(i => i.uid === dragState.uid);
        if (!item) return;
        const rect = workspace.getBoundingClientRect();
        item.x = Math.max(0, Math.min(pt.x - rect.left - dragState.offsetX, rect.width - 90));
        item.y = Math.max(0, Math.min(pt.y - rect.top - dragState.offsetY, rect.height - 90));
        renderWsItem(item);
        highlightCombineTarget(item);
      } else if (dragState.type === 'sidebar') {
        // Create ghost if not exists
        if (!dragState.ghost) {
          const el = elements[dragState.elId];
          const ghost = document.createElement('div');
          ghost.className = 'ws-item dragging';
          ghost.style.position = 'fixed';
          ghost.style.pointerEvents = 'none';
          ghost.style.zIndex = 200;
          ghost.innerHTML = `<div class="icon">${shortName(el.name)}</div><div class="label">${el.name}</div>`;
          document.body.appendChild(ghost);
          dragState.ghost = ghost;
        }
        dragState.ghost.style.left = (pt.x - dragState.offsetX) + 'px';
        dragState.ghost.style.top = (pt.y - dragState.offsetY) + 'px';
      }
    }

    function highlightCombineTarget(draggedItem) {
      // Clear previous
      document.querySelectorAll('.ws-item.combine-target').forEach(el => el.classList.remove('combine-target'));
      const target = findCombineTarget(draggedItem);
      if (target) {
        const div = document.getElementById('ws-' + target.uid);
        if (div) div.classList.add('combine-target');
      }
    }

    function findCombineTarget(draggedItem) {
      const cx = draggedItem.x + 45;
      const cy = draggedItem.y + 45;
      for (const other of workspaceItems) {
        if (other.uid === draggedItem.uid) continue;
        const ox = other.x + 45;
        const oy = other.y + 45;
        const dist = Math.hypot(cx - ox, cy - oy);
        if (dist < 70) return other;
      }
      return null;
    }

    function onDragEnd(e) {
      if (!dragState) return;
      document.removeEventListener('mousemove', onDragMove);
      document.removeEventListener('mouseup', onDragEnd);
      document.removeEventListener('touchmove', onDragMove);
      document.removeEventListener('touchend', onDragEnd);

      const pt = getPointer(e);
      const rect = workspace.getBoundingClientRect();

      if (dragState.type === 'sidebar') {
        if (dragState.ghost) {
          dragState.ghost.remove();
          dragState.ghost = null;
        }
        // Drop only if over workspace
        if (pt.x >= rect.left && pt.x <= rect.right && pt.y >= rect.top && pt.y <= rect.bottom) {
          const x = Math.max(0, Math.min(pt.x - rect.left - 45, rect.width - 90));
          const y = Math.max(0, Math.min(pt.y - rect.top - 45, rect.height - 90));
          createWsItem(dragState.elId, x, y);
        }
      } else if (dragState.type === 'ws') {
        const item = workspaceItems.find(i => i.uid === dragState.uid);
        if (item) {
          const div = document.getElementById('ws-' + item.uid);
          if (div) div.classList.remove('dragging');
          document.querySelectorAll('.ws-item.combine-target').forEach(el => el.classList.remove('combine-target'));

          const target = findCombineTarget(item);
          if (target) {
            tryCombine(item, target);
          }
        }
      }
      dragState = null;
    }

    // ─── Combine logic ─────────────────────────────────────────────────────
    function tryCombine(a, b) {
      const idA = a.elId;
      const idB = b.elId;
      const key = [Math.min(idA, idB), Math.max(idA, idB)].join('_');
      const resultId = recipeMap.get(key);

      if (resultId === undefined) {
        showToast('Nothing happened…');
        return;
      }

      const result = elements[resultId];
      const wasNew = !result.discovered;
      result.discovered = true;
      saveProgress();

      // Remove the two ingredients
      removeWsItem(a.uid);
      removeWsItem(b.uid);

      // Spawn result roughly in the middle
      const midX = (a.x + b.x) / 2;
      const midY = (a.y + b.y) / 2;
      createWsItem(resultId, midX, midY);

      // Visual feedback
      spawnParticles(midX + 45, midY + 45);
      if (wasNew) {
        showToast(`✦ New discovery: ${result.name}!`, true);
        renderList(searchInput.value);
      } else {
        showToast(`Created ${result.name}`);
      }
      updateStats();
    }

    function spawnParticles(x, y) {
      const colors = ['#3b82f6', '#22c55e', '#a78bfa', '#f59e0b', '#ec4899'];
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        p.style.background = colors[i % colors.length];
        workspace.appendChild(p);
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 40 + Math.random() * 50;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;
        p.animate([
          { transform: 'translate(0,0) scale(1)', opacity: 1 },
          { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
        ], { duration: 600 + Math.random() * 300, easing: 'ease-out' }).onfinish = () => p.remove();
      }
    }

    // ─── Events ────────────────────────────────────────────────────────────
    searchInput.addEventListener('input', () => renderList(searchInput.value));

    document.getElementById('clear-ws').addEventListener('click', clearWorkspace);

    document.getElementById('reset-progress').addEventListener('click', () => {
      if (!confirm('Reset all discoveries and clear the workspace?')) return;
      elements.forEach(el => { el.discovered = !el.parents; });
      localStorage.removeItem(STORAGE_KEY);
      clearWorkspace();
      renderList(searchInput.value);
      updateStats();
      showToast('Progress reset');
    });

    // ─── Init ──────────────────────────────────────────────────────────────
    renderList();
    updateStats();
  </script>
</body>
</html>
