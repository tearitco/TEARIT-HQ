# tunables.conf - the hand-tunable "joints" of the phone router (server_route_op), format and discipline copied from %.harnesses/harnecient-fsm/tunables.conf.
# Plain name=value lines, read EVERY router pass (edit and the next pass uses it: no recompile). Everything is commented = the built-in default applies.
# A weight changes ORDER and AMOUNT, never PERMISSION: leases still expire, locked entities still need the owner, spoofed senders are still rejected.
# Every decision that used a joint is one row in observations.log (<epoch_ms>|route|<joint>=<value>|<inputs>|<verdict>): that file is the dataset a heuristic or tomom learns from.
#
# Messages one sender may have routed per rolling 60 seconds (counted from ledger.txt). Over the cap: the message waits in the outbox for a later pass.
#route_max_msgs_per_min=60
#
# Messages routed per router pass in total (all senders). Over the cap: the rest wait for the next pass.
#route_batch_max=100
